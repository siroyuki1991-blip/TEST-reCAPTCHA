<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>reCAPTCHA設置テスト</title>
    <!-- 1. GoogleのreCAPTCHA用スクリプトを読み込みます -->
    <script src="https://google.com" async defer></script>
</head>
<body>

    <!-- フォームのサンプルです -->
    <form action="送信先のプログラム.php" method="POST">
        
        <p>
            <label for="name">お名前：</label><br>
            <input type="text" id="name" name="name" required>
        </p>

        <!-- 2. チェックボックスを表示したい場所にこのdivタグを配置します -->
        <!-- 「あなたのサイトキー」の部分を取得したサイトキーに書き換えてください -->
        <div class="g-recaptcha" data-sitekey="あなたのサイトキー"></div>

        <br>
        <button type="submit">送信する</button>
    </form>

</body>
</html>
